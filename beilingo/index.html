<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背诗</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
        h1 { font-size: 20px; }
        .question { font-size: 22px; margin: 24px 0; }
        .option {
            display: block; width: 100%; padding: 14px; margin: 10px 0;
            font-size: 18px; background: #f5f5f5; border: 2px solid #ddd;
            border-radius: 10px; cursor: pointer; text-align: left;
        }
        .option:hover { background: #eee; }
        .option.correct { background: #d4f8d4; border-color: #4caf50; }
        .option.wrong { background: #ffd6d6; border-color: #f44336; }
        .explain {
            margin-top: 16px; padding: 14px; background: #fffbe6;
            border-left: 4px solid #f0c000; border-radius: 6px; display: none;
        }
        .progress { color: #888; font-size: 14px; }
        .done { font-size: 24px; text-align: center; margin-top: 60px; }
    </style>
</head>
<body>

<div id="app"></div>

<script>
    // ========== 数据：一首诗 ==========
    const poem = {
        title: "静夜思",
        author: "李白",
        lines: [
            { text: "床前明月光", next: "疑是地上霜", translation: "明亮的月光洒在床前" },
            { text: "疑是地上霜", next: "举头望明月", translation: "好像地上泛起了白霜" },
            { text: "举头望明月", next: "低头思故乡", translation: "我抬起头望着天上的明月" },
            { text: "低头思故乡", next: null,         translation: "低下头思念起故乡" }
        ]
    };

    // ========== 状态 ==========
    let queue = [];      // 待考题目（line 的索引）
    let total = 0;       // 总题数（用于进度显示）
    let done = 0;        // 已答对数量

    const app = document.getElementById('app');

    // ========== 初始化 ==========
    function start() {
        // 只考有下一句的（最后一句没得选）
        queue = poem.lines
            .map((_, i) => i)
            .filter(i => poem.lines[i].next !== null);
        total = queue.length;
        done = 0;
        renderQuestion();
    }

    // ========== 渲染一道题 ==========
    function renderQuestion() {
        if (queue.length === 0) return renderDone();

        const idx = queue[0];
        const line = poem.lines[idx];

        // 生成干扰项：从其他句子里挑 3 个不同的
        const others = poem.lines
            .filter(l => l.next && l.next !== line.next)
            .map(l => l.next);
        const options = shuffle([line.next, ...shuffle(others).slice(0, 3)]);

        app.innerHTML = `
    <div class="progress">第 ${done + 1} / ${total} 题 · 《${poem.title}》</div>
    <div class="question">"${line.text}" 的下一句是？</div>
    <div id="options">
      ${options.map(o => `<button class="option" data-val="${o}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain"></div>
  `;

        document.querySelectorAll('.option').forEach(btn => {
            btn.onclick = () => checkAnswer(btn, line);
        });
    }

    // ========== 判分 ==========
    function checkAnswer(btn, line) {
        const chosen = btn.dataset.val;
        const correct = chosen === line.next;

        // 禁用所有选项，标出对错
        document.querySelectorAll('.option').forEach(b => {
            b.onclick = null;
            if (b.dataset.val === line.next) b.classList.add('correct');
        });

        if (correct) {
            done++;
            setTimeout(() => {
                queue.shift();          // 答对：出队
                renderQuestion();
            }, 600);
        } else {
            btn.classList.add('wrong');
            // 显示讲解
            const ex = document.getElementById('explain');
            ex.style.display = 'block';
            ex.innerHTML = `
      <strong>答错了，正确答案是：${line.next}</strong><br><br>
      <b>${line.text}，${line.next}</b><br>
      意思：${line.translation}
      <br><br>
      <button class="option" id="retry" style="text-align:center">知道了，再考我一次</button>
    `;
            document.getElementById('retry').onclick = () => {
                // 关键：答错的题移到队尾，稍后重考
                queue.push(queue.shift());
                renderQuestion();
            };
        }
    }

    // ========== 完成 ==========
    function renderDone() {
        app.innerHTML = `<div class="done">🎉 全部答对！<br>《${poem.title}》</div>
    <div style="text-align:center;margin-top:24px">
      <button class="option" onclick="start()">再来一遍</button>
    </div>`;
    }

    // ========== 工具 ==========
    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    start();
</script>
</body>
</html>
