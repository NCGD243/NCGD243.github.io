<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>主页 👑 管理员</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5; color: #1e293b; line-height: 1.5;
            display: flex; flex-direction: column;
        }
        .app {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            overflow: hidden;
        }
        .toolbar {
            padding: 1rem 1.5rem; background: #fff; border-bottom: 1px solid #e9eef3;
            display: flex; flex-wrap: wrap; align-items: center;
            justify-content: space-between; gap: 1rem;
            flex-shrink: 0;
        }
        .repo-info { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .repo-icon-img {
            width: 32px; height: 32px;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
        }
        .repo-info h1 { font-size: 1.15rem; font-weight: 600; color: #0f172a; }
        .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: #f1f5f9; padding: 0.55rem 1rem; border-radius: 40px;
            font-size: 0.9rem; font-weight: 500; color: #1e293b;
            cursor: pointer; border: 1px solid #e2e8f0; transition: 0.15s;
            font-family: inherit;
        }
        .btn:hover { background: #e6edf4; }
        .btn-primary { background: #1e293b; color: white; border-color: #1e293b; }
        .btn-primary:hover { background: #0f172a; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-login {
            background: #dbeafe; color: #1e40af; border-color: #bfdbfe;
        }
        .btn-login:hover { background: #bfdbfe; }
        .btn-logout {
            background: #fee2e2; color: #991b1b; border-color: #fecaca;
        }
        .btn-logout:hover { background: #fecaca; }
        .btn-zip {
            background: #ede9fe; color: #5b21b6; border-color: #ddd6fe;
        }
        .btn-zip:hover { background: #ddd6fe; }
        .btn-zip:disabled { opacity: 0.6; cursor: wait; }

        .app:not(.is-admin) .admin-only { display: none !important; }

        .path-bar {
            padding: 0.65rem 1.5rem; background: #fafcff; border-bottom: 1px solid #e9eef3;
            font-size: 0.9rem; font-weight: 500; display: flex;
            align-items: center; gap: 0.35rem; flex-wrap: wrap;
            flex-shrink: 0;
        }
        .crumb {
            background: #eef2f6; padding: 0.2rem 0.7rem; border-radius: 30px;
            display: inline-flex; align-items: center; gap: 0.25rem;
        }
        .crumb.current { background: #d9e2ef; font-weight: 600; }
        .crumb[data-path-index] { cursor: pointer; }
        .crumb[data-path-index]:hover { background: #d9e2ef; }
        .file-list {
            padding: 0.75rem 1.5rem 1.5rem;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            position: relative;
        }
        .file-list.drag-over {
            background: #f0f7ff; outline: 2px dashed #3b82f6; outline-offset: -4px; border-radius: 12px;
        }
        .item {
            display: flex; align-items: center; padding: 0.7rem 1rem;
            margin: 0.15rem 0; border-radius: 14px; border: 1px solid transparent;
        }
        .item:hover { background: #f8fafd; border-color: #e2e8f0; }
        .item.openable { cursor: pointer; }
        .item-icon { font-size: 1.4rem; margin-right: 0.9rem; width: 1.8rem; text-align: center; }
        .item-name { flex: 1; font-weight: 500; color: #0f172a; word-break: break-word; }
        .item-name.folder { color: #0f3b7a; font-weight: 600; }
        .item-meta {
            font-size: 0.75rem; color: #64748b; background: #f1f5f9;
            padding: 0.2rem 0.65rem; border-radius: 30px; white-space: nowrap;
        }
        .item-actions { display: flex; gap: 0.4rem; margin-left: 0.8rem; }
        .icon-btn {
            background: transparent; border: none; font-size: 1.1rem;
            padding: 0.2rem 0.4rem; border-radius: 8px; cursor: pointer; color: #5f6c80;
        }
        .icon-btn:hover { background: #e2e8f0; color: #0f172a; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #94a3b8; font-style: italic; }
        #imageInput, #txtInput { display: none; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 0.7rem 1.5rem;
            border-radius: 40px; font-size: 0.9rem; font-weight: 500;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); opacity: 0;
            transition: opacity 0.2s; pointer-events: none; z-index: 300; max-width: 90vw;
            text-align: center;
        }
        .toast.show { opacity: 1; }
        .toast.error { background: #b91c1c; }
        .footnote {
            padding: 0.65rem 1.5rem; background: #fafcff; border-top: 1px solid #e9eef3;
            font-size: 0.8rem; color: #6b7a8f; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;
            flex-shrink: 0;
        }
        .status-badge { display: inline-flex; align-items: center; gap: 0.3rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
        .status-dot.readonly { background: #f59e0b; }
        .status-dot.admin { background: #22c55e; }
        .loading-state { text-align: center; padding: 3rem 1rem; color: #64748b; }
        .item-thumb {
            width: 36px; height: 36px; object-fit: cover; border-radius: 8px;
            margin-right: 0.9rem; flex-shrink: 0; background: #f1f5f9; border: 1px solid #e2e8f0;
        }
        .panel {
            text-align: center; padding: 2.5rem 2rem; max-width: 560px; margin: 0 auto;
        }
        .panel h2 { font-size: 1.25rem; margin-bottom: 0.75rem; color: #0f172a; }
        .panel p { color: #64748b; margin-bottom: 1.25rem; font-size: 0.9rem; }
        .panel code { background: #eef2f6; padding: 0.1rem 0.35rem; border-radius: 4px; }
        .panel a { color: #2563eb; }
        .icon-btn.download-btn:hover { background: #dcfce7; color: #166534; }

        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
            display: none; align-items: center; justify-content: center;
            z-index: 200; padding: 1.5rem;
        }
        .modal-backdrop.show { display: flex; }
        .modal {
            background: white; border-radius: 20px; padding: 1.75rem;
            max-width: 480px; width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
        }
        .modal h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #0f172a; }
        .modal p { font-size: 0.85rem; color: #64748b; margin-bottom: 1.25rem; }
        .modal .field { margin-bottom: 1rem; }
        .modal label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: #334155; margin-bottom: 0.35rem;
        }
        .modal input {
            width: 100%; padding: 0.6rem 0.85rem; border: 1px solid #cbd5e1;
            border-radius: 10px; font-size: 0.9rem; font-family: inherit;
            background: #f8fafc;
        }
        .modal input:focus { outline: 2px solid #3b82f6; outline-offset: -1px; background: white; }
        .modal .row { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.25rem; }
        .modal a { color: #2563eb; }
        .modal code { background: #eef2f6; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.85rem; }

        .admin-badge {
            background: #dcfce7; color: #166534; border: 1px solid #86efac;
            padding: 0.3rem 0.75rem; border-radius: 40px;
            font-size: 0.78rem; font-weight: 600;
            display: inline-flex; align-items: center; gap: 0.3rem;
        }

        .text-modal {
            background: white; border-radius: 20px;
            max-width: 780px; width: 100%; max-height: 85vh;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            overflow: hidden;
        }
        .text-modal-header {
            padding: 1rem 1.5rem; border-bottom: 1px solid #e9eef3;
            display: flex; align-items: center; justify-content: space-between;
            gap: 1rem; flex-shrink: 0;
        }
        .text-modal-header h3 {
            font-size: 1rem; margin: 0; color: #0f172a;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .text-modal-header .actions { display: flex; gap: 0.5rem; }
        .text-modal-body {
            padding: 1.25rem 1.5rem; overflow: auto; flex: 1;
            background: #fafcff;
        }
        .text-modal-body pre {
            font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
            font-size: 0.85rem; line-height: 1.55;
            white-space: pre-wrap; word-break: break-word;
            color: #1e293b; margin: 0;
        }
        .text-modal-body .loading {
            text-align: center; color: #94a3b8; font-style: italic;
        }
        .text-modal-body .error {
            color: #b91c1c;
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="toolbar">
        <div class="repo-info">
            <img class="repo-icon-img" src="/favicon.png" alt="">
            <h1 id="repoTitle">主页</h1>
            <span class="admin-badge admin-only"><span>👑</span> 管理员</span>
        </div>
        <div class="actions">
            <button class="btn admin-only" id="newFolderBtn"><span>📁+</span> 新建文件夹</button>
            <button class="btn admin-only" id="uploadTxtBtn"><span>📄</span> 上传文本</button>
            <button class="btn btn-primary admin-only" id="uploadImgBtn"><span>🖼️</span> 上传图片</button>
            <button class="btn btn-zip" id="downloadZipBtn"><span>📦</span> 下载备份 ZIP</button>
            <button class="btn btn-login" id="loginBtn"><span>🔑</span> 管理员登录</button>
            <button class="btn btn-logout admin-only" id="logoutBtn"><span>🚪</span> 退出登录</button>
        </div>
    </div>

    <div class="path-bar" id="pathBar"><span class="crumb">📁 主页</span></div>
    <div class="file-list" id="fileList"></div>

    <div class="footnote">
    <span class="status-badge">
      <span class="status-dot readonly" id="statusDot"></span>
      <span id="statusText">只读模式 · 任何人可浏览</span>
    </span>
        <span>⚡ 只读无需登录；写入需要管理员登录</span>
    </div>
</div>

<input type="file" id="imageInput" multiple accept="image/*">
<input type="file" id="txtInput" multiple accept=".txt,text/plain">
<div class="toast" id="toast"></div>

<!-- 登录对话框 -->
<div class="modal-backdrop" id="loginModal">
    <div class="modal">
        <h3>🔑 管理员登录</h3>
        <p>输入 GitHub Personal Access Token 以解锁写入权限（上传、删除、新建文件夹）。
            登录状态会保存在此浏览器中，之后打开无需再次输入。</p>
        <div class="field">
            <label>Personal Access Token</label>
            <input type="password" id="loginTokenInput" placeholder="github_pat_..." autocomplete="off">
        </div>
        <div class="row">
            <button class="btn" id="loginCancelBtn">取消</button>
            <button class="btn btn-primary" id="loginConfirmBtn">登录</button>
        </div>
    </div>
</div>

<!-- 文本预览对话框 -->
<div class="modal-backdrop" id="textModal">
    <div class="text-modal">
        <div class="text-modal-header">
            <h3 id="textModalTitle">文本预览</h3>
            <div class="actions">
                <button class="btn" id="textModalDownloadBtn"><span>⬇️</span> 下载</button>
                <button class="btn" id="textModalCloseBtn">关闭</button>
            </div>
        </div>
        <div class="text-modal-body" id="textModalBody">
            <div class="loading">正在加载…</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ================================================================
        // 主页 文件管理器 —— 混合模式
        //
        // - 只读：无需登录。任何访客都能浏览、下载、双击预览。
        // - 写入：需要以管理员身份登录（输入 GitHub Token 一次）。
        //   Token 存在 localStorage，之后打开此浏览器自动保持登录。
        //
        // 目标文件夹：仓库根目录下的 "主页" 文件夹
        // 双击行为：
        //   - 文件夹 → 进入文件夹
        //   - 图片   → 新标签页打开原图
        //   - 文本   → 弹出预览框显示内容
        //
        // ZIP 备份：使用 codeload.github.com 导航式下载，
        //          绕过 CORS 限制，任何人可用。
        // ================================================================

        const TARGET_ROOT = '主页';
        const LS_TOKEN = 'gh-explorer-token-v1';

        const REPO = {
            owner: 'NCGD243',
            repo:  'NCGD243.github.io',
            branch: 'main'
        };

        let token = '';
        let currentPath = [];
        let entriesCache = [];
        let zipInProgress = false;

        const $ = id => document.getElementById(id);
        const app = $('app');
        const fileListEl = $('fileList');
        const pathBar = $('pathBar');
        const newFolderBtn = $('newFolderBtn');
        const uploadTxtBtn = $('uploadTxtBtn');
        const uploadImgBtn = $('uploadImgBtn');
        const downloadZipBtn = $('downloadZipBtn');
        const loginBtn = $('loginBtn');
        const logoutBtn = $('logoutBtn');
        const imageInput = $('imageInput');
        const txtInput = $('txtInput');
        const toastEl = $('toast');
        const statusDot = $('statusDot');
        const statusText = $('statusText');
        const repoTitle = $('repoTitle');

        const loginModal = $('loginModal');
        const loginTokenInput = $('loginTokenInput');
        const loginCancelBtn = $('loginCancelBtn');
        const loginConfirmBtn = $('loginConfirmBtn');

        const textModal = $('textModal');
        const textModalTitle = $('textModalTitle');
        const textModalBody = $('textModalBody');
        const textModalCloseBtn = $('textModalCloseBtn');
        const textModalDownloadBtn = $('textModalDownloadBtn');

        let currentTextEntry = null;

        // ---------- 登录状态 ----------
        function isAdmin() { return !!token; }

        function loadToken() {
            token = localStorage.getItem(LS_TOKEN) || '';
        }
        function saveToken(t) {
            token = t || '';
            if (token) localStorage.setItem(LS_TOKEN, token);
            else localStorage.removeItem(LS_TOKEN);
            updateAuthUI();
        }

        function updateAuthUI() {
            if (isAdmin()) {
                app.classList.add('is-admin');
                statusDot.classList.remove('readonly');
                statusDot.classList.add('admin');
                statusText.textContent = '管理员模式 · 可写入';
                loginBtn.style.display = 'none';
                logoutBtn.style.display = '';
            } else {
                app.classList.remove('is-admin');
                statusDot.classList.remove('admin');
                statusDot.classList.add('readonly');
                statusText.textContent = '只读模式 · 任何人可浏览';
                loginBtn.style.display = '';
                logoutBtn.style.display = 'none';
            }
            repoTitle.textContent = TARGET_ROOT;
        }

        // ---------- 小工具 ----------
        function toast(msg, isError = false) {
            toastEl.textContent = msg;
            toastEl.classList.toggle('error', isError);
            toastEl.classList.add('show');
            clearTimeout(window._toastT);
            window._toastT = setTimeout(() => toastEl.classList.remove('show'), 2500);
        }
        function esc(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }
        function formatSize(b) {
            if (b == null) return '—';
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1048576).toFixed(2) + ' MB';
        }
        function isImageName(n) { return /\.(jpe?g|png|gif|webp|svg|bmp|ico|avif)$/i.test(n); }
        function isTextName(n) { return /\.(txt|md|json|js|css|html|htm|xml|yml|yaml|log|csv|tsv|ini|conf)$/i.test(n); }
        function isHiddenFile(n) { return n.startsWith('.'); }

        function fullPath(relParts) {
            return [TARGET_ROOT, ...relParts].join('/');
        }

        function rawImageUrl(entry) {
            const encodedPath = entry.path.split('/').map(encodeURIComponent).join('/');
            const base = `https://raw.githubusercontent.com/${encodeURIComponent(REPO.owner)}/${encodeURIComponent(REPO.repo)}/${encodeURIComponent(REPO.branch)}/${encodedPath}`;
            const version = entry.sha ? entry.sha.slice(0, 12) : Date.now();
            return `${base}?v=${version}`;
        }

        function rawImageUrlNoCache(entry) {
            const encodedPath = entry.path.split('/').map(encodeURIComponent).join('/');
            return `https://raw.githubusercontent.com/${encodeURIComponent(REPO.owner)}/${encodeURIComponent(REPO.repo)}/${encodeURIComponent(REPO.branch)}/${encodedPath}?t=${Date.now()}`;
        }

        // ---------- GitHub API ----------
        async function gh(method, apiPath, body, { auth = false } = {}) {
            let path = apiPath;
            let query = '';
            const qIndex = apiPath.indexOf('?');
            if (qIndex !== -1) {
                path = apiPath.slice(0, qIndex);
                query = apiPath.slice(qIndex);
            }
            const encodedPath = path.split('/').map(encodeURIComponent).join('/');
            const url = `https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${encodedPath}${query}`;

            const headers = {
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };
            if (auth) {
                if (!token) throw new Error('需要管理员登录');
                headers['Authorization'] = `Bearer ${token}`;
            }
            const opts = { method, headers };
            if (body) {
                headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(body);
            }
            const res = await fetch(url, opts);
            if (res.status === 404) return { __notFound: true };

            if (!res.ok) {
                let errBody = {};
                try { errBody = await res.json(); } catch {}
                const msg = errBody.message || res.statusText;

                if (res.status === 401) {
                    saveToken('');
                    throw new Error('Token 无效或已过期，已自动退出登录');
                }
                if (res.status === 403) {
                    const isRateLimit = /rate limit|secondary rate limit|abuse/i.test(msg)
                        || res.headers.get('x-ratelimit-remaining') === '0';
                    if (isRateLimit) {
                        throw new Error('GitHub 请求过于频繁，请稍后再试：' + msg);
                    }
                    throw new Error('权限不足：' + msg);
                }
                if (res.status === 409 || res.status === 422) {
                    throw new Error('数据冲突（可能是缓存延迟），请重试：' + msg);
                }
                throw new Error(msg);
            }
            return res.json();
        }

        async function listFolder(apiPath) {
            const data = await gh('GET', `${apiPath}?ref=${encodeURIComponent(REPO.branch)}`);
            if (data.__notFound) return { notFound: true, entries: [] };
            if (!Array.isArray(data)) return { notFound: false, entries: [data] };
            return { notFound: false, entries: data };
        }

        async function listFolderAfterWrite(apiPath, { expectName, absentName } = {}) {
            const MAX_TRIES = 8;
            let last = null;
            let lastErr = null;
            for (let i = 0; i < MAX_TRIES; i++) {
                try {
                    const res = await listFolder(apiPath);
                    last = res;
                    if (absentName && !res.entries.some(e => e.name === absentName)) return res;
                    if (expectName && res.entries.some(e => e.name === expectName)) return res;
                    if (!expectName && !absentName) return res;
                } catch (e) {
                    lastErr = e;
                    console.warn('listFolder 重试失败：', e.message);
                }
                await new Promise(r => setTimeout(r, 500 + i * 400));
            }
            if (last) return last;
            if (lastErr) throw lastErr;
            return await listFolder(apiPath);
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => {
                    const s = r.result;
                    resolve(s.slice(s.indexOf(',') + 1));
                };
                r.onerror = () => reject(r.error);
                r.readAsDataURL(file);
            });
        }

        function base64ToText(b64) {
            try {
                const clean = b64.replace(/\n/g, '');
                const binary = atob(clean);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                return null;
            }
        }

        function base64ToBlob(b64) {
            const clean = b64.replace(/\n/g, '');
            const binary = atob(clean);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new Blob([bytes], { type: 'application/octet-stream' });
        }

        // ---------- 登录对话框 ----------
        function openLoginModal() {
            return new Promise((resolve, reject) => {
                loginTokenInput.value = '';
                loginModal.classList.add('show');
                loginTokenInput.focus();

                const cleanup = () => {
                    loginModal.classList.remove('show');
                    loginConfirmBtn.removeEventListener('click', onConfirm);
                    loginCancelBtn.removeEventListener('click', onCancel);
                    loginTokenInput.removeEventListener('keydown', onKey);
                };
                const onConfirm = async () => {
                    const v = loginTokenInput.value.trim();
                    if (!v) { toast('Token 不能为空', true); return; }
                    try {
                        const res = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}`, {
                            headers: {
                                'Authorization': `Bearer ${v}`,
                                'Accept': 'application/vnd.github+json'
                            }
                        });
                        if (!res.ok) {
                            const j = await res.json().catch(() => ({}));
                            throw new Error(j.message || res.statusText);
                        }
                    } catch (e) {
                        toast('登录失败：' + e.message, true);
                        return;
                    }
                    saveToken(v);
                    cleanup();
                    toast('👑 已登录为管理员');
                    resolve();
                };
                const onCancel = () => { cleanup(); reject(new Error('cancelled')); };
                const onKey = (e) => {
                    if (e.key === 'Enter') onConfirm();
                    if (e.key === 'Escape') onCancel();
                };

                loginConfirmBtn.addEventListener('click', onConfirm);
                loginCancelBtn.addEventListener('click', onCancel);
                loginTokenInput.addEventListener('keydown', onKey);
            });
        }

        async function ensureAdmin() {
            if (isAdmin()) return true;
            try {
                await openLoginModal();
                return true;
            } catch {
                return false;
            }
        }

        // ---------- 打开文件 ----------
        function openImageInNewTab(entry) {
            const url = rawImageUrlNoCache(entry);
            window.open(url, '_blank', 'noopener');
        }

        async function openTextPreview(entry) {
            currentTextEntry = entry;
            textModalTitle.textContent = entry.name;
            textModalBody.innerHTML = `<div class="loading">正在加载…</div>`;
            textModal.classList.add('show');

            try {
                const data = await gh('GET', `${entry.path}?ref=${encodeURIComponent(REPO.branch)}`);
                if (data.__notFound || !data.content) throw new Error('内容不可用');

                const text = base64ToText(data.content);
                if (text === null) throw new Error('无法解码文本');

                textModalBody.innerHTML = `<pre>${esc(text)}</pre>`;
            } catch (e) {
                console.error(e);
                textModalBody.innerHTML = `<div class="error">加载失败：${esc(e.message)}</div>`;
            }
        }

        function closeTextModal() {
            textModal.classList.remove('show');
            currentTextEntry = null;
            textModalBody.innerHTML = '';
        }

        async function downloadCurrentText() {
            if (!currentTextEntry) return;
            try {
                const data = await gh('GET', `${currentTextEntry.path}?ref=${encodeURIComponent(REPO.branch)}`);
                if (data.__notFound || !data.content) throw new Error('内容不可用');
                const blob = base64ToBlob(data.content);
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = currentTextEntry.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
            } catch (e) {
                toast('下载失败：' + e.message, true);
            }
        }

        function handleDoubleClick(entry) {
            if (entry.type === 'dir') {
                openFolder(entry.name);
                return;
            }
            if (isImageName(entry.name)) {
                openImageInNewTab(entry);
                return;
            }
            if (isTextName(entry.name)) {
                openTextPreview(entry);
                return;
            }
            downloadFile(entry);
        }

        // ---------- 下载单个文件 ----------
        async function downloadFile(entry) {
            try {
                toast(`⬇️ 正在下载 ${entry.name}…`);
                const data = await gh('GET', `${entry.path}?ref=${encodeURIComponent(REPO.branch)}`);
                if (data.__notFound || !data.content) throw new Error('内容不可用');
                const blob = base64ToBlob(data.content);

                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = entry.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                toast(`✅ 已下载 ${entry.name}`);
            } catch (e) {
                console.error(e);
                toast('下载失败：' + e.message, true);
            }
        }

        // ---------- ZIP 备份（codeload.github.com 导航式下载）----------
        // 使用 <a> 触发浏览器原生下载，绕过 CORS 限制。
        // 不需要 token，任何人（包括访客）都可以使用。
        function downloadRepoZip() {
            if (zipInProgress) return;
            zipInProgress = true;

            const originalText = downloadZipBtn.innerHTML;
            downloadZipBtn.disabled = true;
            downloadZipBtn.innerHTML = '<span>⏳</span> 下载中…';

            const url = `https://codeload.github.com/${REPO.owner}/${REPO.repo}/zip/refs/heads/${encodeURIComponent(REPO.branch)}`;
            const a = document.createElement('a');
            a.href = url;
            a.download = `${REPO.repo}.zip`;
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                zipInProgress = false;
                downloadZipBtn.disabled = false;
                downloadZipBtn.innerHTML = originalText;
                toast('✅ 已开始下载 ZIP');
            }, 1000);
        }

        // ---------- 渲染 ----------
        async function render(opts = {}) {
            fileListEl.innerHTML = `<div class="loading-state">正在加载 ${esc(TARGET_ROOT)}…</div>`;

            try {
                let result;
                if (opts.expectName || opts.absentName) {
                    result = await listFolderAfterWrite(fullPath(currentPath), opts);
                } else {
                    result = await listFolder(fullPath(currentPath));
                }

                const { notFound, entries } = result;

                if (notFound) {
                    if (currentPath.length === 0) {
                        fileListEl.innerHTML = `
            <div class="panel">
              <h2>📂 未找到 <code>${TARGET_ROOT}</code> 文件夹</h2>
              <p>仓库在 <code>${esc(REPO.branch)}</code> 分支上还没有 <code>${esc(TARGET_ROOT)}</code> 文件夹。</p>
              <button class="btn btn-primary" id="createRootBtn">➕ 创建 ${esc(TARGET_ROOT)} 文件夹</button>
            </div>`;
                        $('createRootBtn').addEventListener('click', createRootFolder);
                        return;
                    }
                    fileListEl.innerHTML = `<div class="empty-state">⚠️ 未找到文件夹</div>`;
                    return;
                }

                entriesCache = entries;
                const visibleEntries = entries.filter(e => !isHiddenFile(e.name));

                visibleEntries.sort((a, b) => {
                    if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
                    return a.name.localeCompare(b.name);
                });

                renderBreadcrumb();

                if (!visibleEntries.length) {
                    fileListEl.innerHTML = `<div class="empty-state">📭 此文件夹为空</div>`;
                    return;
                }

                let html = '';
                for (const entry of visibleEntries) {
                    const isFolder = entry.type === 'dir';
                    const isImage = !isFolder && isImageName(entry.name);
                    const isText = !isFolder && isTextName(entry.name);
                    const openable = isFolder || isImage || isText;

                    let thumb = `<span class="item-icon">${isFolder ? '📁' : '📄'}</span>`;

                    if (isImage) {
                        const imgUrl = rawImageUrl(entry);
                        thumb = `<img class="item-thumb" src="${imgUrl}" loading="lazy"
                    onerror="this.outerHTML='<span class=\\'item-icon\\' title=\\'图片加载失败\\'>🖼️</span>'; console.warn('图片加载失败:', '${esc(imgUrl)}');">`;
                    }

                    html += `
          <div class="item ${openable ? 'openable' : ''}" data-name="${esc(entry.name)}" data-type="${entry.type}" data-sha="${esc(entry.sha || '')}" data-path="${esc(entry.path)}">
            ${thumb}
            <span class="item-name ${isFolder ? 'folder' : ''}">${esc(entry.name)}</span>
            ${!isFolder ? `<span class="item-meta">${formatSize(entry.size)}</span>` : ''}
            <div class="item-actions">
              ${isFolder ? `<button class="icon-btn open-folder" data-folder="${esc(entry.name)}" title="打开">📂</button>` : ''}
              ${!isFolder ? `<button class="icon-btn download-btn" data-name="${esc(entry.name)}" data-path="${esc(entry.path)}" data-sha="${esc(entry.sha || '')}" title="下载">⬇️</button>` : ''}
              <button class="icon-btn delete-item admin-only" data-path="${esc(entry.path)}" data-type="${entry.type}" data-sha="${esc(entry.sha || '')}" title="删除（需管理员）">🗑️</button>
            </div>
          </div>`;
                }
                fileListEl.innerHTML = html;

                fileListEl.querySelectorAll('.open-folder').forEach(b =>
                    b.addEventListener('click', e => { e.stopPropagation(); openFolder(b.dataset.folder); }));

                fileListEl.querySelectorAll('.download-btn').forEach(b =>
                    b.addEventListener('click', e => {
                        e.stopPropagation();
                        downloadFile({
                            name: b.dataset.name,
                            path: b.dataset.path,
                            sha: b.dataset.sha
                        });
                    }));

                fileListEl.querySelectorAll('.delete-item').forEach(b =>
                    b.addEventListener('click', e => { e.stopPropagation(); deleteEntry(b.dataset.path, b.dataset.type, b.dataset.sha); }));

                fileListEl.querySelectorAll('.item').forEach(el =>
                    el.addEventListener('dblclick', e => {
                        if (e.target.closest('.icon-btn')) return;
                        const entry = {
                            name: el.dataset.name,
                            type: el.dataset.type,
                            sha: el.dataset.sha,
                            path: el.dataset.path
                        };
                        const full = entriesCache.find(x => x.path === el.dataset.path) || entry;
                        handleDoubleClick(full);
                    }));
            } catch (err) {
                fileListEl.innerHTML = `<div class="empty-state">⚠️ ${esc(err.message)}</div>`;
            }
        }

        function renderBreadcrumb() {
            let html = `<span class="crumb" data-path-index="-1">📁 ${esc(TARGET_ROOT)}</span>`;
            currentPath.forEach((seg, i) => {
                html += `<span>/</span>`;
                const last = i === currentPath.length - 1;
                html += `<span class="crumb ${last ? 'current' : ''}" data-path-index="${i}">📁 ${esc(seg)}</span>`;
            });
            pathBar.innerHTML = html;
            pathBar.querySelectorAll('.crumb[data-path-index]').forEach(c =>
                c.addEventListener('click', () => navigateToIndex(+c.dataset.pathIndex)));
        }

        function openFolder(name) { currentPath.push(name); render(); }
        function navigateToIndex(idx) {
            currentPath = idx < 0 ? [] : currentPath.slice(0, idx + 1);
            render();
        }

        // ---------- 写操作 ----------
        async function createRootFolder() {
            if (!await ensureAdmin()) return;
            try {
                await gh('PUT', `${TARGET_ROOT}/.gitkeep`, {
                    message: `创建 ${TARGET_ROOT} 文件夹`,
                    content: btoa(''),
                    branch: REPO.branch
                }, { auth: true });
                toast(`📁 已创建 ${TARGET_ROOT}/`);
                await render({ expectName: TARGET_ROOT });
            } catch (e) { toast('失败：' + e.message, true); }
        }

        async function createNewFolder() {
            if (!await ensureAdmin()) return;
            const name = prompt('新文件夹名称：', '新文件夹');
            if (!name || !name.trim()) return;
            const n = name.trim();
            if (n.includes('/') || n.includes('\\')) { alert('名称不能包含斜杠。'); return; }
            if (entriesCache.some(e => e.name === n)) { alert(`"${n}" 已存在。`); return; }

            const apiPath = fullPath([...currentPath, n]) + '/.gitkeep';
            try {
                await gh('PUT', apiPath, {
                    message: `创建文件夹 ${[...currentPath, n].join('/')}`,
                    content: btoa(''),
                    branch: REPO.branch
                }, { auth: true });
                toast(`📁 已创建 ${n}/`);
                await render({ expectName: n });
            } catch (e) { toast('失败：' + e.message, true); }
        }

        async function deleteEntry(path, type, sha) {
            if (!await ensureAdmin()) return;
            const fileName = path.split('/').pop();

            if (type === 'dir') {
                if (!confirm(`删除文件夹 "${fileName}" 及其所有内容？`)) return;
                try {
                    await deleteFolderRecursive(path);
                    toast('🗑️ 文件夹已删除');
                    await render({ absentName: fileName });
                } catch (e) { toast('失败：' + e.message, true); }
                return;
            }

            if (!sha) { toast('缺少 SHA', true); return; }
            if (!confirm(`删除 "${fileName}"？`)) return;

            try {
                await gh('DELETE', path, {
                    message: `删除 ${path}`,
                    sha,
                    branch: REPO.branch
                }, { auth: true });
                toast('🗑️ 已删除');
                await render({ absentName: fileName });
            } catch (e) { toast('删除失败：' + e.message, true); }
        }

        async function deleteFolderRecursive(path) {
            const { entries } = await listFolder(path);
            for (const entry of entries) {
                if (entry.type === 'dir') {
                    await deleteFolderRecursive(entry.path);
                } else {
                    await gh('DELETE', entry.path, {
                        message: `删除 ${entry.path}`,
                        sha: entry.sha,
                        branch: REPO.branch
                    }, { auth: true });
                }
            }
        }

        async function uploadFiles(files, kind) {
            if (!await ensureAdmin()) return;

            const wanted = Array.from(files).filter(f =>
                kind === 'image' ? f.type.startsWith('image/') : (f.type === 'text/plain' || /\.txt$/i.test(f.name))
            );

            if (!wanted.length) { toast('未选择匹配的文件', true); return; }
            if (wanted.length < files.length) toast(`已跳过 ${files.length - wanted.length} 个文件`, true);

            let added = 0;
            let errors = [];
            let lastName = null;

            for (const file of wanted) {
                try {
                    let existingSha = null;
                    for (const e of entriesCache) {
                        if (e.name === file.name && e.type === 'file') { existingSha = e.sha; break; }
                    }
                    const apiPath = fullPath([...currentPath, file.name]);
                    const base64 = await fileToBase64(file);
                    const body = {
                        message: existingSha ? `更新 ${file.name}` : `添加 ${file.name}`,
                        content: base64,
                        branch: REPO.branch
                    };
                    if (existingSha) body.sha = existingSha;
                    await gh('PUT', apiPath, body, { auth: true });
                    added++;
                    lastName = file.name;
                } catch (e) {
                    console.error(e);
                    errors.push(`${file.name}: ${e.message}`);
                }
            }

            if (added > 0) {
                toast(`⬆️ 已上传 ${added} 个文件`);
                await render({ expectName: lastName });
            }
            if (errors.length) toast(`⚠️ ${errors.length} 个失败：${errors[0]}`, true);
        }

        // ---------- 事件 ----------
        newFolderBtn.addEventListener('click', createNewFolder);
        uploadImgBtn.addEventListener('click', () => imageInput.click());
        uploadTxtBtn.addEventListener('click', () => txtInput.click());
        downloadZipBtn.addEventListener('click', downloadRepoZip);
        loginBtn.addEventListener('click', () => ensureAdmin());
        logoutBtn.addEventListener('click', () => {
            if (!confirm('退出管理员登录？')) return;
            saveToken('');
            toast('已退出登录');
        });

        imageInput.addEventListener('change', async e => {
            if (e.target.files?.length) await uploadFiles(e.target.files, 'image');
            imageInput.value = '';
        });
        txtInput.addEventListener('change', async e => {
            if (e.target.files?.length) await uploadFiles(e.target.files, 'txt');
            txtInput.value = '';
        });

        fileListEl.addEventListener('dragover', e => {
            e.preventDefault();
            if (isAdmin()) fileListEl.classList.add('drag-over');
        });
        fileListEl.addEventListener('dragleave', e => {
            if (!fileListEl.contains(e.relatedTarget)) fileListEl.classList.remove('drag-over');
        });
        fileListEl.addEventListener('drop', async e => {
            e.preventDefault();
            fileListEl.classList.remove('drag-over');
            if (!isAdmin()) { toast('请先以管理员身份登录', true); return; }
            const files = e.dataTransfer.files;
            if (!files?.length) return;
            const arr = Array.from(files);
            const imgs = arr.filter(f => f.type.startsWith('image/'));
            const txts = arr.filter(f => f.type === 'text/plain' || /\.txt$/i.test(f.name));
            if (imgs.length) await uploadFiles(imgs, 'image');
            if (txts.length) await uploadFiles(txts, 'txt');
            const other = arr.length - imgs.length - txts.length;
            if (other > 0) toast(`${other} 个不支持的文件已跳过`, true);
        });

        // 文本模态框事件
        textModalCloseBtn.addEventListener('click', closeTextModal);
        textModal.addEventListener('click', e => {
            if (e.target === textModal) closeTextModal();
        });
        textModalDownloadBtn.addEventListener('click', downloadCurrentText);
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && textModal.classList.contains('show')) {
                closeTextModal();
            }
        });

        // ---------- 启动 ----------
        (async function init() {
            loadToken();
            updateAuthUI();
            await render();
        })();
    })();
</script>
</body>
</html>
