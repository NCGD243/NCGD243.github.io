<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>主页 👑 管理员</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5; color: #1e293b; line-height: 1.5;
            display: flex; flex-direction: column;
        }
        .app {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            overflow: hidden;
        }
        .toolbar {
            padding: 1rem 1.5rem; background: #fff; border-bottom: 1px solid #e9eef3;
            display: flex; flex-wrap: wrap; align-items: center;
            justify-content: space-between; gap: 1rem;
            flex-shrink: 0;
        }
        .repo-info { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .repo-icon-img {
            width: 32px; height: 32px;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
        }
        .repo-info h1 { font-size: 1.15rem; font-weight: 600; color: #0f172a; }
        .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: #f1f5f9; padding: 0.55rem 1rem; border-radius: 40px;
            font-size: 0.9rem; font-weight: 500; color: #1e293b;
            cursor: pointer; border: 1px solid #e2e8f0; transition: 0.15s;
            font-family: inherit;
        }
        .btn:hover { background: #e6edf4; }
        .btn-primary { background: #1e293b; color: white; border-color: #1e293b; }
        .btn-primary:hover { background: #0f172a; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-login {
            background: #dbeafe; color: #1e40af; border-color: #bfdbfe;
        }
        .btn-login:hover { background: #bfdbfe; }
        .btn-logout {
            background: #fee2e2; color: #991b1b; border-color: #fecaca;
        }
        .btn-logout:hover { background: #fecaca; }
        .btn-zip {
            background: #ede9fe; color: #5b21b6; border-color: #ddd6fe;
        }
        .btn-zip:hover { background: #ddd6fe; }

        .app:not(.is-admin) .admin-only { display: none !important; }

        .path-bar {
            padding: 0.65rem 1.5rem; background: #fafcff; border-bottom: 1px solid #e9eef3;
            font-size: 0.9rem; font-weight: 500; display: flex;
            align-items: center; gap: 0.35rem; flex-wrap: wrap;
            flex-shrink: 0;
        }
        .crumb {
            background: #eef2f6; padding: 0.2rem 0.7rem; border-radius: 30px;
            display: inline-flex; align-items: center; gap: 0.25rem;
        }
        .crumb.current { background: #d9e2ef; font-weight: 600; }
        .crumb[data-path-index] { cursor: pointer; }
        .crumb[data-path-index]:hover { background: #d9e2ef; }
        .file-list {
            padding: 0.75rem 1.5rem 1.5rem;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            position: relative;
        }
        .file-list.drag-over {
            background: #f0f7ff; outline: 2px dashed #3b82f6; outline-offset: -4px; border-radius: 12px;
        }
        .item {
            display: flex; align-items: center; padding: 0.7rem 1rem;
            margin: 0.15rem 0; border-radius: 14px; border: 1px solid transparent;
        }
        .item:hover { background: #f8fafd; border-color: #e2e8f0; }
        .item.openable { cursor: pointer; }
        .item-icon { font-size: 1.4rem; margin-right: 0.9rem; width: 1.8rem; text-align: center; }
        .item-name { flex: 1; font-weight: 500; color: #0f172a; word-break: break-word; }
        .item-name.folder { color: #0f3b7a; font-weight: 600; }
        .item-meta {
            font-size: 0.75rem; color: #64748b; background: #f1f5f9;
            padding: 0.2rem 0.65rem; border-radius: 30px; white-space: nowrap;
        }
        .item-actions { display: flex; gap: 0.4rem; margin-left: 0.8rem; }
        .icon-btn {
            background: transparent; border: none; font-size: 1.1rem;
            padding: 0.2rem 0.4rem; border-radius: 8px; cursor: pointer; color: #5f6c80;
        }
        .icon-btn:hover { background: #e2e8f0; color: #0f172a; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #94a3b8; font-style: italic; }
        #imageInput, #txtInput { display: none; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 0.7rem 1.5rem;
            border-radius: 40px; font-size: 0.9rem; font-weight: 500;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); opacity: 0;
            transition: opacity 0.2s; pointer-events: none; z-index: 300; max-width: 90vw;
            text-align: center;
        }
        .toast.show { opacity: 1; }
        .toast.error { background: #b91c1c; }
        .footnote {
            padding: 0.65rem 1.5rem; background: #fafcff; border-top: 1px solid #e9eef3;
            font-size: 0.8rem; color: #6b7a8f; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;
            flex-shrink: 0;
        }
        .status-badge { display: inline-flex; align-items: center; gap: 0.3rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
        .status-dot.readonly { background: #f59e0b; }
        .status-dot.admin { background: #22c55e; }
        .loading-state { text-align: center; padding: 3rem 1rem; color: #64748b; }
        .item-thumb {
            width: 36px; height: 36px; object-fit: cover; border-radius: 8px;
            margin-right: 0.9rem; flex-shrink: 0; background: #f1f5f9; border: 1px solid #e2e8f0;
        }
        .panel {
            text-align: center; padding: 2.5rem 2rem; max-width: 560px; margin: 0 auto;
        }
        .panel h2 { font-size: 1.25rem; margin-bottom: 0.75rem; color: #0f172a; }
        .panel p { color: #64748b; margin-bottom: 1.25rem; font-size: 0.9rem; }
        .panel code { background: #eef2f6; padding: 0.1rem 0.35rem; border-radius: 4px; }
        .panel a { color: #2563eb; }
        .icon-btn.download-btn:hover { background: #dcfce7; color: #166534; }

        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
            display: none; align-items: center; justify-content: center;
            z-index: 200; padding: 1.5rem;
        }
        .modal-backdrop.show { display: flex; }
        .modal {
            background: white; border-radius: 20px; padding: 1.75rem;
            max-width: 480px; width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
        }
        .modal h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #0f172a; }
        .modal p { font-size: 0.85rem; color: #64748b; margin-bottom: 1.25rem; }
        .modal .field { margin-bottom: 1rem; }
        .modal label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: #334155; margin-bottom: 0.35rem;
        }
        .modal input {
            width: 100%; padding: 0.6rem 0.85rem; border: 1px solid #cbd5e1;
            border-radius: 10px; font-size: 0.9rem; font-family: inherit;
            background: #f8fafc;
        }
        .modal input:focus { outline: 2px solid #3b82f6; outline-offset: -1px; background: white; }
        .modal .row { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.25rem; }
        .modal a { color: #2563eb; }
        .modal code { background: #eef2f6; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.85rem; }

        .admin-badge {
            background: #dcfce7; color: #166534; border: 1px solid #86efac;
            padding: 0.3rem 0.75rem; border-radius: 40px;
            font-size: 0.78rem; font-weight: 600;
            display: inline-flex; align-items: center; gap: 0.3rem;
        }

        /* 文本预览模态框 */
        .text-modal {
            background: white; border-radius: 20px;
            max-width: 780px; width: 100%; max-height: 85vh;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            overflow: hidden;
        }
        .text-modal-header {
            padding: 1rem 1.5rem; border-bottom: 1px solid #e9eef3;
            display: flex; align-items: center; justify-content: space-between;
            gap: 1rem; flex-shrink: 0;
        }
        .text-modal-header h3 {
            font-size: 1rem; margin: 0; color: #0f172a;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .text-modal-header .actions { display: flex; gap: 0.5rem; }
        .text-modal-body {
            padding: 1.25rem 1.5rem; overflow: auto; flex: 1;
            background: #fafcff;
        }
        .text-modal-body pre {
            font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
            font-size: 0.85rem; line-height: 1.55;
            white-space: pre-wrap; word-break: break-word;
            color: #1e293b; margin: 0;
        }
        .text-modal-body .loading {
            text-align: center; color: #94a3b8; font-style: italic;
        }
        .text-modal-body .error {
            color: #b91c1c;
        }

        /* zip 进度条 */
        .progress-badge {
            position: fixed; bottom: 24px; right: 24px;
            background: #1e293b; color: white;
            padding: 0.75rem 1.25rem; border-radius: 14px;
            font-size: 0.85rem; font-weight: 500;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            display: none; z-index: 350;
            min-width: 220px;
        }
        .progress-badge.show { display: block; }
        .progress-badge .bar {
            margin-top: 0.5rem; height: 4px;
            background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden;
        }
        .progress-badge .bar > div {
            height: 100%; width: 0%;
            background: #22c55e; border-radius: 4px;
            transition: width 0.15s;
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="toolbar">
        <div class="repo-info">
            <img class="repo-icon-img" src="/favicon.png" alt="">
            <h1 id="repoTitle">主页</h1>
            <span class="admin-badge admin-only"><span>👑</span> 管理员</span>
        </div>
        <div class="actions">
            <button class="btn admin-only" id="newFolderBtn"><span>📁+</span> 新建文件夹</button>
            <button class="btn admin-only" id="uploadTxtBtn"><span>📄</span> 上传文本</button>
            <button class="btn btn-primary admin-only" id="uploadImgBtn"><span>🖼️</span> 上传图片</button>
            <button class="btn btn-zip admin-only" id="downloadZipBtn"><span>🗜️</span> 下载 ZIP</button>
            <button class="btn btn-login" id="loginBtn"><span>🔑</span> 管理员登录</button>
            <button class="btn btn-logout admin-only" id="logoutBtn"><span>🚪</span> 退出登录</button>
        </div>
    </div>

    <div class="path-bar" id="pathBar"><span class="crumb">📁 主页</span></div>
    <div class="file-list" id="fileList"></div>

    <div class="footnote">
    <span class="status-badge">
      <span class="status-dot readonly" id="statusDot"></span>
      <span id="statusText">只读模式 · 任何人可浏览</span>
    </span>
        <span>⚡ 只读无需登录；写入需要管理员登录</span>
    </div>
</div>

<input type="file" id="imageInput" multiple accept="image/*">
<input type="file" id="txtInput" multiple accept=".txt,text/plain">
<div class="toast" id="toast"></div>

<!-- zip 进度条 -->
<div class="progress-badge" id="zipProgress">
    <div id="zipProgressText">正在打包…</div>
    <div class="bar"><div id="zipProgressBar"></div></div>
</div>

<!-- 登录对话框 -->
<div class="modal-backdrop" id="loginModal">
    <div class="modal">
        <h3>🔑 管理员登录</h3>
        <p>输入 GitHub Personal Access Token 以解锁写入权限（上传、删除、新建文件夹）。
            登录状态会保存在此浏览器中，之后打开无需再次输入。</p>
        <div class="field">
            <label>Personal Access Token</label>
            <input type="password" id="loginTokenInput" placeholder="github_pat_..." autocomplete="off">
        </div>
        <div class="row">
            <button class="btn" id="loginCancelBtn">取消</button>
            <button class="btn btn-primary" id="loginConfirmBtn">登录</button>
        </div>
    </div>
</div>

<!-- 文本预览对话框 -->
<div class="modal-backdrop" id="textModal">
    <div class="text-modal">
        <div class="text-modal-header">
            <h3 id="textModalTitle">文本预览</h3>
            <div class="actions">
                <button class="btn" id="textModalDownloadBtn"><span>⬇️</span> 下载</button>
                <button class="btn" id="textModalCloseBtn">关闭</button>
            </div>
        </div>
        <div class="text-modal-body" id="textModalBody">
            <div class="loading">正在加载…</div>
        </div>
    </div>
</div>

<!-- JSZip（用于打包 zip） -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
    (function() {
        // ================================================================
        // 主页 文件管理器 —— 混合模式
        //
        // - 只读：无需登录。任何访客都能浏览、下载、双击预览。
        // - 写入：需要以管理员身份登录（输入 GitHub Token 一次）。
        //   Token 存在 localStorage，之后打开此浏览器自动保持登录。
        //
        // 目标文件夹：仓库根目录下的 "主页" 文件夹
        // 双击行为：
        //   - 文件夹 → 进入文件夹
        //   - 图片   → 新标签页打开原图
        //   - 文本   → 弹出预览框显示内容
        // 管理员额外功能：
        //   - 🗜️ 下载 ZIP —— 把整个"主页"文件夹打包成 主页.zip 下载
        // ================================================================

        const TARGET_ROOT = '主页';
        const LS_TOKEN = 'gh-explorer-token-v1';

        const REPO = {
            owner: 'NCGD243',
            repo:  'NCGD243.github.io',
            branch: 'main'
        };

        let token = '';
        let currentPath = [];
        let entriesCache = [];

        const $ = id => document.getElementById(id);
        const app = $('app');
        const fileListEl = $('fileList');
        const pathBar = $('pathBar');
        const newFolderBtn = $('newFolderBtn');
        const uploadTxtBtn = $('uploadTxtBtn');
        const uploadImgBtn = $('uploadImgBtn');
        const downloadZipBtn = $('downloadZipBtn');
        const loginBtn = $('loginBtn');
        const logoutBtn = $('logoutBtn');
        const imageInput = $('imageInput');
        const txtInput = $('txtInput');
        const toastEl = $('toast');
        const statusDot = $('statusDot');
        const statusText = $('statusText');
        const repoTitle = $('repoTitle');

        const loginModal = $('loginModal');
        const loginTokenInput = $('loginTokenInput');
        const loginCancelBtn = $('loginCancelBtn');
        const loginConfirmBtn = $('loginConfirmBtn');

        const textModal = $('textModal');
        const textModalTitle = $('textModalTitle');
        const textModalBody = $('textModalBody');
        const textModalCloseBtn = $('textModalCloseBtn');
        const textModalDownloadBtn = $('textModalDownloadBtn');

        const zipProgress = $('zipProgress');
        const zipProgressText = $('zipProgressText');
        const zipProgressBar = $('zipProgressBar');

        let currentTextEntry = null;

        // ---------- 登录状态 ----------
        function isAdmin() { return !!token; }

        function loadToken() {
            token = localStorage.getItem(LS_TOKEN) || '';
        }
        function saveToken(t) {
            token = t || '';
            if (token) localStorage.setItem(LS_TOKEN, token);
            else localStorage.removeItem(LS_TOKEN);
            updateAuthUI();
        }

        function updateAuthUI() {
            if (isAdmin()) {
                app.classList.add('is-admin');
                statusDot.classList.remove('readonly');
                statusDot.classList.add('admin');
                statusText.textContent = '管理员模式 · 可写入';
                loginBtn.style.display = 'none';
                logoutBtn.style.display = '';
            } else {
                app.classList.remove('is-admin');
                statusDot.classList.remove('admin');
                statusDot.classList.add('readonly');
                statusText.textContent = '只读模式 · 任何人可浏览';
                loginBtn.style.display = '';
                logoutBtn.style.display = 'none';
            }
            repoTitle.textContent = TARGET_ROOT;
        }

        // ---------- 小工具 ----------
        function toast(msg, isError = false) {
            toastEl.textContent = msg;
            toastEl.classList.toggle('error', isError);
            toastEl.classList.add('show');
            clearTimeout(window._toastT);
            window._toastT = setTimeout(() => toastEl.classList.remove('show'), 2500);
        }
        function esc(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }
        function formatSize(b) {
            if (b == null) return '—';
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1048576).toFixed(2) + ' MB';
        }
        function isImageName(n) { return /\.(jpe?g|png|gif|webp|svg|bmp|ico|avif)$/i.test(n); }
        function isTextName(n) { return /\.(txt|md|json|js|css|html|htm|xml|yml|yaml|log|csv|tsv|ini|conf)$/i.test(n); }
        function isHiddenFile(n) { return n.startsWith('.'); }

        function fullPath(relParts) {
            return [TARGET_ROOT, ...relParts].join('/');
        }

        function rawImageUrl(entry) {
            const encodedPath = entry.path.split('/').map(encodeURIComponent).join('/');
            const base = `https://raw.githubusercontent.com/${encodeURIComponent(REPO.owner)}/${encodeURIComponent(REPO.repo)}/${encodeURIComponent(REPO.branch)}/${encodedPath}`;
            const version = entry.sha ? entry.sha.slice(0, 12) : Date.now();
            return `${base}?v=${version}`;
        }

        function rawImageUrlNoCache(entry) {
            const encodedPath = entry.path.split('/').map(encodeURIComponent).join('/');
            return `https://raw.githubusercontent.com/${encodeURIComponent(REPO.owner)}/${encodeURIComponent(REPO.repo)}/${encodeURIComponent(REPO.branch)}/${encodedPath}?t=${Date.now()}`;
        }

        // ---------- GitHub API ----------
        async function gh(method, apiPath, body, { auth = false } = {}) {
            let path = apiPath;
            let query = '';
            const qIndex = apiPath.indexOf('?');
            if (qIndex !== -1) {
                path = apiPath.slice(0, qIndex);
                query = apiPath.slice(qIndex);
            }
            const encodedPath = path.split('/').map(encodeURIComponent).join('/');
            const url = `https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${encodedPath}${query}`;

            const headers = {
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };
            if (auth) {
                if (!token) throw new Error('需要管理员登录');
                headers['Authorization'] = `Bearer ${token}`;
            }
            const opts = { method, headers };
            if (body) {
                headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(body);
            }
            const res = await fetch(url, opts);
            if (res.status === 404) return { __notFound: true };

            if (!res.ok) {
                let errBody = {};
                try { errBody = await res.json(); } catch {}
                const msg = errBody.message || res.statusText;

                if (res.status === 401) {
                    saveToken('');
                    throw new Error('Token 无效或已过期，已自动退出登录');
                }
                if (res.status === 403) {
                    const isRateLimit = /rate limit|secondary rate limit|abuse/i.test(msg)
                        || res.headers.get('x-ratelimit-remaining') === '0';
                    if (isRateLimit) {
                        throw new Error('GitHub 请求过于频繁，请稍后再试：' + msg);
                    }
                    throw new Error('权限不足：' + msg);
                }
                if (res.status === 409 || res.status === 422) {
                    throw new Error('数据冲突（可能是缓存延迟），请重试：' + msg);
                }
                throw new Error(msg);
            }
            return res.json();
        }

        async function listFolder(apiPath) {
            const data = await gh('GET', `${apiPath}?ref=${encodeURIComponent(REPO.branch)}`);
            if (data.__notFound) return { notFound: true, entries: [] };
            if (!Array.isArray(data)) return { notFound: false, entries: [data] };
            return { notFound: false, entries: data };
        }

        async function listFolderAfterWrite(apiPath, { expectName, absentName } = {}) {
            const MAX_TRIES = 8;
            let last = null;
            let lastErr = null;
            for (let i = 0; i < MAX_TRIES; i++) {
                try {
                    const res = await listFolder(apiPath);
                    last = res;
                    if (absentName && !res.entries.some(e => e.name === absentName)) return res;
                    if (expectName && res.entries.some(e => e.name === expectName)) return res;
                    if (!expectName && !absentName) return res;
                } catch (e) {
                    lastErr = e;
                    console.warn('listFolder 重试失败：', e.message);
                }
                await new Promise(r => setTimeout(r, 500 + i * 400));
            }
            if (last) return last;
            if (lastErr) throw lastErr;
            return await listFolder(apiPath);
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => {
                    const s = r.result;
                    resolve(s.slice(s.indexOf(',') + 1));
                };
                r.onerror = () => reject(r.error);
                r.readAsDataURL(file);
            });
        }

        function base64ToText(b64) {
            try {
                const clean = b64.replace(/\n/g, '');
                const binary = atob(clean);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                return null;
            }
        }

        function base64ToBlob(b64) {
            const clean = b64.replace(/\n/g, '');
            const binary = atob(clean);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new Blob([bytes], { type: 'application/octet-stream' });
        }

        // ---------- 登录对话框 ----------
        function openLoginModal() {
            return new Promise((resolve, reject) => {
                loginTokenInput.value = '';
                loginModal.classList.add('show');
                loginTokenInput.focus();

                const cleanup = () => {
                    loginModal.classList.remove('show');
                    loginConfirmBtn.removeEventListener('click', onConfirm);
                    loginCancelBtn.removeEventListener('click', onCancel);
                    loginTokenInput.removeEventListener('keydown', onKey);
                };
                const onConfirm = async () => {
                    const v = loginTokenInput.value.trim();
                    if (!v) { toast('Token 不能为空', true); return; }
                    try {
                        const res = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}`, {
                            headers: {
                                'Authorization': `Bearer ${v}`,
                                'Accept': 'application/vnd.github+json'
                            }
                        });
                        if (!res.ok) {
                            const j = await res.json().catch(() => ({}));
                            throw new Error(j.message || res.statusText);
                        }
                    } catch (e) {
                        toast('登录失败：' + e.message, true);
                        return;
                    }
                    saveToken(v);
                    cleanup();
                    toast('👑 已登录为管理员');
                    resolve();
                };
                const onCancel = () => { cleanup(); reject(new Error('cancelled')); };
                const onKey = (e) => {
                    if (e.key === 'Enter') onConfirm();
                    if (e.key === 'Escape') onCancel();
                };

                loginConfirmBtn.addEventListener('click', onConfirm);
                loginCancelBtn.addEventListener('click', onCancel);
                loginTokenInput.addEventListener('keydown', onKey);
            });
        }

        async function ensureAdmin() {
            if (isAdmin()) return true;
            try {
                await openLoginModal();
                return true;
            } catch {
                return false;
            }
        }

        // ---------- 打开文件 ----------
        function openImageInNewTab(entry) {
            const url = rawImageUrlNoCache(entry);
            window.open(url, '_blank', 'noopener');
        }

        async function openTextPreview(entry) {
            currentTextEntry = entry;
            textModalTitle.textContent = entry.name;
            textModalBody.innerHTML = `<div class="loading">正在加载…</div>`;
            textModal.classList.add('show');

            try {
                const data = await gh('GET', `${entry.path}?ref=${encodeURIComponent(REPO.branch)}`);
                if (data.__notFound || !data.content) throw new Error('内容不可用');

                const text = base64ToText(data.content);
                if (text === null) throw new Error('无法解码文本');

                textModalBody.innerHTML = `<pre>${esc(text)}</pre>`;
            } catch (e) {
                console.error(e);
                textModalBody.innerHTML = `<div class="error">加载失败：${esc(e.message)}</div>`;
            }
        }

        function closeTextModal() {
            textModal.classList.remove('show');
            currentTextEntry = null;
            textModalBody.innerHTML = '';
        }

        async function downloadCurrentText() {
            if (!currentTextEntry) return;
            try {
                const data = await gh('GET', `${currentTextEntry.path}?ref=${encodeURIComponent(REPO.branch)}`);
                if (data.__notFound || !data.content) throw new Error('内容不可用');
                const blob = base64ToBlob(data.content);
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = currentTextEntry.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
            } catch (e) {
                toast('下载失败：' + e.message, true);
            }
        }

        function handleDoubleClick(entry) {
            if (entry.type === 'dir') {
                openFolder(entry.name);
                return;
            }
            if (isImageName(entry.name)) {
                openImageInNewTab(entry);
                return;
            }
            if (isTextName(entry.name)) {
                openTextPreview(entry);
                return;
            }
            downloadFile(entry);
        }

        // ---------- 下载单个文件 ----------
        async function downloadFile(entry) {
            try {
                toast(`⬇️ 正在下载 ${entry.name}…`);
                const data = await gh('GET', `${entry.path}?ref=${encodeURIComponent(REPO.branch)}`);
                if (data.__notFound || !data.content) throw new Error('内容不可用');
                const blob = base64ToBlob(data.content);

                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = entry.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                toast(`✅ 已下载 ${entry.name}`);
            } catch (e) {
                console.error(e);
                toast('下载失败：' + e.message, true);
            }
        }
